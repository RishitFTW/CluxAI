tasks:
  db_path: .cluxai/tasks.db


llm:
  provider: ollama
  model: qwen3:8B 

embeddings:
  provider: gemini
  model: gemini-embedding-2
  judge_model: gpt-4o-mini # cheaper model used only for LLM-as-judge

rag:
 mode: hybrid # semantic | hybrid

vector_store:
 provider: qdrant
 retrieval_mode: hybrid # dense | sparse | hybrid

qdrant:
  collection_name: codebase_hybrid

chromadb:
  persist_dir: .cluxai/chromadb/
  collection_name: codebase

memory:
  db_path: .cluxai/memory/memory.db
  summarize_at_tokens: 400
  keep_last_messages: 20
  
skills:
  skills_dir: .cluxai/skills

elasticsearch:
  url: http://localhost:9200
  index_name: codebase
